<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热播影视推荐 - 2026精选</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            color: #f8fafc;
            background-attachment: fixed;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 3em;
            font-weight: 800;
            background: linear-gradient(to right, #ec4899, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        header p {
            color: #94a3b8;
            font-size: 1.2em;
            font-weight: 300;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 25px;
            padding-left: 15px;
            border-left: 5px solid;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .section-title.drama { border-color: #ec4899; color: #fbcfe8; }
        .section-title.tv { border-color: #f59e0b; color: #fef3c7; }
        .section-title.anime { border-color: #06b6d4; color: #cffafe; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-image {
            width: 100%;
            height: 200px;
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-image img {
            transform: scale(1.1);
        }

        .card-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(30, 41, 59, 1), transparent);
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.25em;
            font-weight: 700;
            margin-bottom: 10px;
            color: #f8fafc;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.85em;
            color: #94a3b8;
        }

        .rating {
            color: #fbbf24;
            font-weight: 700;
            background: rgba(251, 191, 36, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .card-desc {
            color: #cbd5e1;
            font-size: 0.9em;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .watch-btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 12px 25px;
            background: linear-gradient(135deg, #ec4899, #be185d);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }

        .watch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5);
        }

        .watch-btn.tv {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }
        .watch-btn.tv:hover { box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5); }

        .watch-btn.anime {
            background: linear-gradient(135deg, #06b6d4, #0369a1);
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }
        .watch-btn.anime:hover { box-shadow: 0 8px 25px rgba(6, 182, 212, 0.5); }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.75em;
            margin-right: 6px;
            margin-bottom: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hot {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 800;
            z-index: 10;
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.5);
            letter-spacing: 1px;
        }

        /* 骨架屏加载动画 */
        .skeleton {
            animation: skeleton-loading 1s linear infinite alternate;
        }

        @keyframes skeleton-loading {
            0% {
                background-color: rgba(255, 255, 255, 0.05);
            }
            100% {
                background-color: rgba(255, 255, 255, 0.15);
            }
        }

        .skeleton-img {
            width: 100%;
            height: 200px;
            border-radius: 20px 20px 0 0;
        }

        .skeleton-text {
            height: 20px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .skeleton-btn {
            height: 40px;
            border-radius: 12px;
            margin-top: auto;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #666;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            header { padding: 30px 15px; }
            header h1 { font-size: 2.2em; }
            .section-title { font-size: 1.6em; }
            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
                gap: 20px;
            }
            .card:hover { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 热播影视推荐</h1>
            <p>2026年精选 · 紧跟潮流 · 品质推荐</p>
        </header>

        <!-- 短剧板块 -->
        <section class="section">
            <h2 class="section-title drama">🔥 热门短剧</h2>
            <div class="cards-grid" id="shorts-container">
                <!-- Data will be loaded here -->
            </div>
        </section>

        <!-- 电视剧板块 -->
        <section class="section">
            <h2 class="section-title tv">📺 精品电视剧</h2>
            <div class="cards-grid" id="tv-container">
                <!-- Data will be loaded here -->
            </div>
        </section>

        <!-- 动漫板块 -->
        <section class="section">
            <h2 class="section-title anime">🎌 精选动漫</h2>
            <div class="cards-grid" id="anime-container">
                <!-- Data will be loaded here -->
            </div>
        </section>

        <footer>
            <p>© 2026 热播影视推荐 | 内容来源网络，仅供推荐参考</p>
            <p>更新时间：2026年3月</p>
        </footer>
    </div>

    <script>
        // 使用自己的代理服务器解决跨域问题
        const API_BASE = "http://localhost:8080/api/proxy?url=" + encodeURIComponent("https://cj.lziapi.com/api.php/provide/vod/?ac=detail");
        const CATEGORIES = {
            shorts: { id: 46, containerId: 'shorts-container', btnClass: '' },
            tv: { id: 13, containerId: 'tv-container', btnClass: 'tv' },
            anime: { id: 29, containerId: 'anime-container', btnClass: 'anime' }
        };

        // 创建骨架屏
        function createSkeleton() {
            return `
                <div class="card">
                    <div class="skeleton skeleton-img"></div>
                    <div class="card-content">
                        <div class="skeleton skeleton-text" style="width: 80%;"></div>
                        <div class="skeleton skeleton-text" style="width: 50%; margin-bottom: 20px;"></div>
                        <div class="skeleton skeleton-text" style="width: 100%;"></div>
                        <div class="skeleton skeleton-text" style="width: 100%;"></div>
                        <div class="skeleton skeleton-btn"></div>
                    </div>
                </div>
            `;
        }

        // 初始化骨架屏
        function initSkeletons() {
            Object.values(CATEGORIES).forEach(cat => {
                const container = document.getElementById(cat.containerId);
                container.innerHTML = Array(4).fill(createSkeleton()).join('');
            });
        }

        // 解析 m3u8 播放链接
        function getPlayUrl(vod_play_url) {
            if (!vod_play_url) return '';
            const sources = vod_play_url.split('$$$');
            let m3u8Source = sources.find(s => s.includes('m3u8')) || sources[0];
            const episodes = m3u8Source.split('#');
            if (episodes.length > 0) {
                const parts = episodes[0].split('$');
                if (parts.length > 1) {
                    return parts[1];
                }
            }
            return '';
        }

        // 渲染卡片
        function renderCards(containerId, movies, btnClass) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (!movies || movies.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8;">暂无数据</p>';
                return;
            }

            movies.slice(0, 4).forEach(movie => {
                const playUrl = getPlayUrl(movie.vod_play_url);
                const isHot = movie.vod_hits > 1000 ? '<span class="hot">🔥 热播</span>' : '';
                const tagsHtml = (movie.vod_class || '').split(',').slice(0, 3).map(tag =>
                    tag.trim() ? `<span class="tag">${tag.trim()}</span>` : ''
                ).join('');

                const playLink = playUrl ? `play.html?url=${encodeURIComponent(playUrl)}&title=${encodeURIComponent(movie.vod_name)}` : '#';

                // Fallback image handling
                const imgUrl = movie.vod_pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 300"><rect fill="%231e293b" width="400" height="300"/><text fill="%2394a3b8" font-family="sans-serif" font-size="20" dy="10.5" font-weight="bold" x="50%" y="50%" text-anchor="middle">暂无图片</text></svg>';

                const cardHtml = `
                    <div class="card" style="opacity: 0; transform: translateY(20px);">
                        <div class="card-image">
                            <img src="${imgUrl}" alt="${movie.vod_name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100%\\' height=\\'100%\\' viewBox=\\'0 0 400 300\\'><rect fill=\\'%231e293b\\' width=\\'400\\' height=\\'300\\'/><text fill=\\'%2394a3b8\\' font-family=\\'sans-serif\\' font-size=\\'20\\' dy=\\'10.5\\' font-weight=\\'bold\\' x=\\'50%\\' y=\\'50%\\' text-anchor=\\'middle\\'>加载失败</text></svg>'">
                            ${isHot}
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${movie.vod_name}</h3>
                            <div class="card-info">
                                <span class="rating">⭐ ${movie.vod_score || '暂无评分'}</span>
                                <span>${movie.vod_remarks || ''}</span>
                            </div>
                            <div style="margin-bottom: 10px;">${tagsHtml}</div>
                            <p class="card-desc">${(movie.vod_blurb || movie.vod_content || '暂无简介').replace(/<[^>]+>/g, '')}</p>
                            <a href="${playLink}" class="watch-btn ${btnClass}">立即观看</a>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });

            // Trigger animations
            setTimeout(() => {
                const cards = container.querySelectorAll('.card');
                cards.forEach((card, index) => {
                    setTimeout(() => {
                        card.style.transition = 'all 0.5s ease';
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    }, index * 100);
                });
            }, 100);
        }

        // 获取数据
        async function fetchData() {
            initSkeletons();

            // 并行获取数据以提升加载速度
            const promises = Object.entries(CATEGORIES).map(async ([key, category]) => {
                try {
                    const response = await fetch(`${API_BASE}&t=${category.id}&pg=1`);
                    if (!response.ok) throw new Error('Network response was not ok');
                    const data = await response.json();
                    renderCards(category.containerId, data.list, category.btnClass);
                } catch (error) {
                    console.error(`Error fetching data for ${key}:`, error);
                    document.getElementById(category.containerId).innerHTML = '<p style="color: #ef4444;">数据加载失败，请稍后重试</p>';
                }
            });

            await Promise.all(promises);
        }

        // 页面加载完成后获取数据
        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
