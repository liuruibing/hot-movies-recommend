<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>热播影视推荐 - 2026精选</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0f12;
            min-height: 100vh;
            color: #f8fafc;
            /* Modern, dark app-like background with subtle glow */
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.15) 0, transparent 50%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        header p {
            color: #94a3b8;
            font-size: 1rem;
            font-weight: 500;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.6em;
            font-weight: 800;
            margin-bottom: 20px;
            padding-left: 0;
            border-left: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 24px;
            border-radius: 4px;
        }

        .section-title.drama::before { background: linear-gradient(to bottom, #ec4899, #f43f5e); }
        .section-title.tv::before { background: linear-gradient(to bottom, #f59e0b, #fbbf24); }
        .section-title.anime::before { background: linear-gradient(to bottom, #06b6d4, #38bdf8); }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        @media (min-width: 640px) {
            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 20px;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .card-image {
            width: 100%;
            padding-top: 140%; /* Cinematic portrait ratio */
            background-color: #1e293b;
            position: relative;
            overflow: hidden;
        }

        .card-image img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .card:hover .card-image img {
            transform: scale(1.08);
        }

        .card-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(13, 15, 18, 1) 0%, transparent 100%);
            pointer-events: none;
        }

        .card-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            position: relative;
            z-index: 2;
            margin-top: -30px; /* Pull text over the gradient */
        }

        .card-title {
            font-size: 1.1em;
            font-weight: 800;
            margin-bottom: 6px;
            color: #ffffff;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        .rating {
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0,0,0,0.4);
            padding: 3px 8px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .tags {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.2);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #a5b4fc;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
            line-height: 1.5;
        }

        .watch-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            margin-top: auto;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .watch-btn::before {
            content: '▶';
            font-size: 0.8rem;
        }

        .watch-btn:hover {
            background: #ffffff;
            color: #0d0f12;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .watch-btn.tv { border-color: rgba(245, 158, 11, 0.3); color: #fcd34d; }
        .watch-btn.tv:hover { background: #fcd34d; color: #0d0f12; }

        .watch-btn.anime { border-color: rgba(6, 182, 212, 0.3); color: #67e8f9; }
        .watch-btn.anime:hover { background: #67e8f9; color: #0d0f12; }

        .hot {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 800;
            z-index: 10;
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.5);
            letter-spacing: 1px;
        }

        /* 骨架屏加载动画 */
        .skeleton .card-img-wrapper { background: rgba(255,255,255,0.05); }
        .skeleton .card-info { margin-top: 0; padding-top: 20px; }

        .skeleton {
            animation: skeleton-loading 1s linear infinite alternate;
        }

        @keyframes skeleton-loading {
            0% {
                background-color: rgba(255, 255, 255, 0.03);
            }
            100% {
                background-color: rgba(255, 255, 255, 0.08);
            }
        }

        .skeleton-img {
            width: 100%;
            padding-top: 140%;
        }

        .skeleton-text {
            height: 20px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .skeleton-btn {
            height: 40px;
            border-radius: 12px;
            margin-top: auto;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #666;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            header { padding: 30px 15px; }
            header h1 { font-size: 2.2em; }
            .section-title { font-size: 1.6em; }
            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
                gap: 20px;
            }
            .card:hover { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 热播影视推荐</h1>
            <p>2026年精选 · 紧跟潮流 · 品质推荐</p>
        </header>

        <!-- 短剧板块 -->
        <section class="section">
            <h2 class="section-title drama">🔥 热门短剧</h2>
            <div class="cards-grid" id="shorts-container">
                <!-- Data will be loaded here -->
            </div>
        </section>

        <!-- 电视剧板块 -->
        <section class="section">
            <h2 class="section-title tv">📺 精品电视剧</h2>
            <div class="cards-grid" id="tv-container">
                <!-- Data will be loaded here -->
            </div>
        </section>

        <!-- 动漫板块 -->
        <section class="section">
            <h2 class="section-title anime">🎌 精选动漫</h2>
            <div class="cards-grid" id="anime-container">
                <!-- Data will be loaded here -->
            </div>
        </section>

        <footer>
            <p>© 2026 热播影视推荐 | 内容来源网络，仅供推荐参考</p>
            <p>更新时间：2026年3月</p>
        </footer>
    </div>

    <script>
        // 使用自己的代理服务器解决跨域问题
        const API_BASE = "http://localhost:8080/api/proxy?url=" + encodeURIComponent("https://cj.lziapi.com/api.php/provide/vod/?ac=detail");
        const CATEGORIES = {
            shorts: { id: 46, containerId: 'shorts-container', btnClass: '' },
            tv: { id: 13, containerId: 'tv-container', btnClass: 'tv' },
            anime: { id: 29, containerId: 'anime-container', btnClass: 'anime' }
        };

        // 创建骨架屏
        function createSkeleton() {
            return `
                <div class="card skeleton">
                    <div class="card-img-wrapper skeleton-img"></div>
                    <div class="card-content card-info">
                        <div class="skeleton skeleton-text" style="width: 80%; height: 24px;"></div>
                        <div class="skeleton skeleton-text" style="width: 40%; height: 16px; margin-bottom: 16px;"></div>
                        <div class="skeleton skeleton-text" style="width: 100%;"></div>
                        <div class="skeleton skeleton-text" style="width: 90%;"></div>
                        <div class="skeleton skeleton-text" style="width: 70%; margin-bottom: 20px;"></div>
                        <div class="skeleton skeleton-btn" style="height: 44px; border-radius: 12px; margin-top: auto;"></div>
                    </div>
                </div>
            `;
        }

        // 初始化骨架屏
        function initSkeletons() {
            Object.values(CATEGORIES).forEach(cat => {
                const container = document.getElementById(cat.containerId);
                container.innerHTML = Array(4).fill(createSkeleton()).join('');
            });
        }

        // 解析 m3u8 播放链接
        function getPlayUrl(vod_play_url) {
            if (!vod_play_url) return '';
            const sources = vod_play_url.split('$$$');
            let m3u8Source = sources.find(s => s.includes('m3u8')) || sources[0];
            const episodes = m3u8Source.split('#');
            if (episodes.length > 0) {
                const parts = episodes[0].split('$');
                if (parts.length > 1) {
                    return parts[1];
                }
            }
            return '';
        }

        // 渲染卡片
        function renderCards(containerId, movies, btnClass) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (!movies || movies.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8;">暂无数据</p>';
                return;
            }

            movies.slice(0, 4).forEach(movie => {
                const playUrl = getPlayUrl(movie.vod_play_url);
                const isHot = movie.vod_hits > 1000 ? '<span class="hot">🔥 热播</span>' : '';
                const tagsHtml = (movie.vod_class || '').split(',').slice(0, 3).map(tag =>
                    tag.trim() ? `<span class="tag">${tag.trim()}</span>` : ''
                ).join('');

                const playLink = playUrl ? `play.html?url=${encodeURIComponent(playUrl)}&title=${encodeURIComponent(movie.vod_name)}` : '#';

                // Fallback image handling
                const imgUrl = movie.vod_pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 300"><rect fill="%231e293b" width="400" height="300"/><text fill="%2394a3b8" font-family="sans-serif" font-size="20" dy="10.5" font-weight="bold" x="50%" y="50%" text-anchor="middle">暂无图片</text></svg>';

                const cardHtml = `
                    <div class="card" style="opacity: 0; transform: translateY(20px);">
                        <div class="card-img-wrapper">
                            <img class="card-img" src="${imgUrl}" alt="${movie.vod_name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100%\\' height=\\'100%\\' viewBox=\\'0 0 400 300\\'><rect fill=\\'%231e293b\\' width=\\'400\\' height=\\'300\\'/><text fill=\\'%2394a3b8\\' font-family=\\'sans-serif\\' font-size=\\'20\\' dy=\\'10.5\\' font-weight=\\'bold\\' x=\\'50%\\' y=\\'50%\\' text-anchor=\\'middle\\'>加载失败</text></svg>'">
                            ${isHot}
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${movie.vod_name}</h3>
                            <div class="card-info">
                                <span class="rating">⭐ ${movie.vod_score || '暂评'}</span>
                                <span>${movie.vod_remarks || ''}</span>
                            </div>
                            <div class="tags">${tagsHtml}</div>
                            <p class="card-desc">${(movie.vod_blurb || movie.vod_content || '暂无简介').replace(/<[^>]+>/g, '').substring(0, 60)}...</p>
                            <a href="${playLink}" class="watch-btn ${btnClass}">立即观看</a>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });

            // Trigger animations
            setTimeout(() => {
                const cards = container.querySelectorAll('.card');
                cards.forEach((card, index) => {
                    setTimeout(() => {
                        card.style.transition = 'all 0.5s ease';
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    }, index * 100);
                });
            }, 100);
        }

        // 获取数据
        async function fetchData() {
            initSkeletons();

            // 并行获取数据以提升加载速度
            const promises = Object.entries(CATEGORIES).map(async ([key, category]) => {
                try {
                    const response = await fetch(`${API_BASE}&t=${category.id}&pg=1`);
                    if (!response.ok) throw new Error('Network response was not ok');
                    const data = await response.json();
                    renderCards(category.containerId, data.list, category.btnClass);
                } catch (error) {
                    console.error(`Error fetching data for ${key}:`, error);
                    document.getElementById(category.containerId).innerHTML = '<p style="color: #ef4444;">数据加载失败，请稍后重试</p>';
                }
            });

            await Promise.all(promises);
        }

        // 页面加载完成后获取数据
        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
