<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播放视频</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            padding: 15px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0));
            display: flex;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            margin-right: 15px;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .video-title {
            font-size: 18px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            max-width: calc(100% - 150px);
        }

        .player-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        video {
            width: 100%;
            max-height: 100%;
            outline: none;
            background: #000;
        }

        .error-msg {
            display: none;
            color: #ff6b6b;
            text-align: center;
            padding: 30px;
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            max-width: 400px;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .error-msg h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .error-msg p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .retry-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .retry-btn:hover {
            transform: scale(1.05);
        }

        .loading-spinner {
            display: none;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #aaa;
            z-index: 5;
        }
    </style>
    <!-- 引入 hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="history.back()">
            <span>←</span> 返回
        </button>
        <div class="video-title" id="title">正在加载...</div>
    </div>

    <div class="player-container">
        <video id="video" controls autoplay playsinline webkit-playsinline></video>
        <div class="loading-spinner" id="loadingSpinner"></div>
        <div class="error-msg" id="errorMsg">
            <h3>⚠️ 播放失败</h3>
            <p id="errorDetail">视频加载失败，请重试或检查链接。</p>
            <button class="retry-btn" onclick="location.reload()">重试播放</button>
        </div>
        <div class="status-text" id="statusText"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const videoUrl = urlParams.get('url');
            const videoTitle = urlParams.get('title');

            const titleEl = document.getElementById('title');
            const videoEl = document.getElementById('video');
            const errorEl = document.getElementById('errorMsg');
            const errorDetailEl = document.getElementById('errorDetail');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const statusText = document.getElementById('statusText');

            // 设置标题
            if (videoTitle) {
                const decodedTitle = decodeURIComponent(videoTitle);
                titleEl.textContent = decodedTitle;
                document.title = decodedTitle + " - 播放";
            } else {
                titleEl.textContent = "视频播放";
            }

            // 验证视频链接
            if (!videoUrl) {
                showError('未提供视频播放链接', '请从首页选择影片进行播放');
                return;
            }

            const url = decodeURIComponent(videoUrl);
            
            // 验证 URL 格式
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                showError('无效的视频链接', '链接格式不正确，请返回重新选择');
                return;
            }

            // 显示加载状态
            loadingSpinner.style.display = 'block';
            statusText.textContent = '正在加载视频...';

            // 检查浏览器是否支持 HLS
            if (Hls.isSupported()) {
                const hls = new Hls({
                    debug: false,
                    // 容错配置
                    fragLoadingTimeOut: 20000,
                    manifestLoadingTimeOut: 20000,
                    startLevel: -1, // 自动选择最佳画质
                    capLevelToPlayerSize: true
                });
                
                hls.loadSource(url);
                hls.attachMedia(videoEl);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    loadingSpinner.style.display = 'none';
                    statusText.textContent = '视频已就绪，正在播放...';
                    videoEl.play().catch(e => {
                        console.log("Auto-play prevented:", e);
                        statusText.textContent = '点击播放按钮开始观看';
                    });
                });

                hls.on(Hls.Events.FRAG_LOADED, function() {
                    statusText.textContent = '';
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        loadingSpinner.style.display = 'none';
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.error("网络错误");
                                showError('网络错误', '视频加载失败，请检查网络连接后重试');
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.error("媒体错误");
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                showError('播放错误', '无法播放该视频，请选择其他影片');
                                break;
                        }
                    }
                });
            }
            // 对于 Safari 浏览器，原生支持 m3u8
            else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                videoEl.src = url;
                videoEl.addEventListener('loadedmetadata', function() {
                    loadingSpinner.style.display = 'none';
                    statusText.textContent = '视频已就绪，正在播放...';
                    videoEl.play().catch(e => {
                        console.log("Auto-play prevented:", e);
                        statusText.textContent = '点击播放按钮开始观看';
                    });
                });
                videoEl.addEventListener('error', function() {
                    loadingSpinner.style.display = 'none';
                    showError('播放错误', '视频加载失败，请重试');
                });
            } else {
                loadingSpinner.style.display = 'none';
                showError('不支持的格式', '您的浏览器不支持 HLS 视频播放，请使用 Chrome、Firefox 或 Safari 浏览器');
            }

            // 显示错误信息
            function showError(title, detail) {
                errorEl.querySelector('h3').textContent = '⚠️ ' + title;
                errorDetailEl.textContent = detail;
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
